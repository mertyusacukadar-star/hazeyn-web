<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bağlantı Bekleniyor</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#292018,#090a0d 62%);font-family:Arial,sans-serif;color:#fff;padding:24px}.card{width:min(520px,96vw);text-align:center;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);border-radius:28px;padding:42px;box-shadow:0 30px 80px rgba(0,0,0,.35)}img{width:250px;max-width:80%;margin-bottom:24px}h1{margin:0 0 12px;font-size:30px}p{color:rgba(255,255,255,.7);line-height:1.55;margin:0 0 24px}button{border:0;border-radius:14px;padding:14px 22px;background:linear-gradient(135deg,#c4912f,#e2b65a);font-size:15px;font-weight:900;cursor:pointer;color:#171109}
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/hazeyn-logo.png" alt="Hazeyn Turizm">
    <h1>İnternet bağlantısı bekleniyor</h1>
    <p>Yolcu ve muhasebe kayıtları bilgisayarlar arasında güvenli biçimde eşitlenebilmek için internet bağlantısına ihtiyaç duyar.</p>
    <button type="button" onclick="location.href='https://www.hazeynturizm.com/admin.html?desktop=1'">Tekrar Dene</button>
  </main>
</body>
</html>
